name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, test & screenshots
    # Xcode 27.1 ships the iOS 27.1 SDK. Apps built with older SDKs run letterboxed on iPhone Duo.
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Xcode and simulators
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Install tools
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick simulators
        id: sim
        run: |
          echo "iphone=$(python3 scripts/pick_simulator.py 'iPhone 18 Pro' || python3 scripts/pick_simulator.py)" >> "$GITHUB_OUTPUT"
          echo "duo=$(python3 scripts/pick_simulator.py 'iPhone Duo' || true)" >> "$GITHUB_OUTPUT"

      - name: Build & run tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Kasumi.xcodeproj \
            -scheme Kasumi \
            -destination "id=${{ steps.sim.outputs.iphone }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Screenshots on iPhone
        run: bash scripts/screenshots.sh "${{ steps.sim.outputs.iphone }}" screenshots/iphone

      - name: Screenshots on iPhone Duo
        if: steps.sim.outputs.duo != ''
        continue-on-error: true
        run: bash scripts/screenshots.sh "${{ steps.sim.outputs.duo }}" screenshots/duo

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore
