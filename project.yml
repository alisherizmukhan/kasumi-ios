name: Kasumi

options:
  bundleIdPrefix: com.alisherizmukhan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""

targets:
  Kasumi:
    type: application
    platform: iOS
    sources:
      - path: Kasumi
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alisherizmukhan.Kasumi
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Kasumi/Info.plist
      properties:
        CFBundleDisplayName: Kasumi
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSSupportsLiveActivities: true
        NSCameraUsageDescription: Take a photo to turn it into a video.
        NSPhotoLibraryAddUsageDescription: Save your generated videos to Photos.
        UIBackgroundModes: [remote-notification]
    dependencies:
      - target: KasumiWidgets
    scheme:
      testTargets: [KasumiTests]
      storeKitConfiguration: StoreKit/Products.storekit

  KasumiWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: KasumiWidgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alisherizmukhan.Kasumi.Widgets
    info:
      path: KasumiWidgets/Info.plist
      properties:
        CFBundleDisplayName: Kasumi
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  KasumiTests:
    type: bundle.unit-test
    platform: iOS
    sources: [KasumiTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Kasumi
