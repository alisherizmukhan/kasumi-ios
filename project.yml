name: Lumen

options:
  bundleIdPrefix: com.alisherizmukhan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""

targets:
  Lumen:
    type: application
    platform: iOS
    sources:
      - path: Lumen
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alisherizmukhan.Lumen
    info:
      path: Lumen/Info.plist
      properties:
        CFBundleDisplayName: Lumen
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSSupportsLiveActivities: true
        NSCameraUsageDescription: Take a photo to turn it into a video.
        NSPhotoLibraryAddUsageDescription: Save your generated videos to Photos.
        UIBackgroundModes: [remote-notification]
    dependencies:
      - target: LumenWidgets
    scheme:
      testTargets: [LumenTests]
      storeKitConfiguration: StoreKit/Products.storekit

  LumenWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: LumenWidgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alisherizmukhan.Lumen.Widgets
    info:
      path: LumenWidgets/Info.plist
      properties:
        CFBundleDisplayName: Lumen
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  LumenTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LumenTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Lumen
